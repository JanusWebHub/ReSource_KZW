<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Wasser-Messdaten Berlin</title>
  <style>
    :root { font-family: system-ui, sans-serif; color-scheme: light dark; --accent: #d94b55; --muted: #777; --panel: color-mix(in srgb, Canvas 94%, #888 6%); }
    body { max-width: 1000px; margin: 0 auto; padding: 1.25rem; }
    h1 { margin-bottom: .25rem; }
    .muted, small { color: var(--muted); }
    .panel { background: var(--panel); border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 12px; padding: 1rem; margin: 1rem 0; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; }
    button, select { font: inherit; padding: .55rem .7rem; }
    button { cursor: pointer; }
    .range-control { display: grid; grid-template-columns: 1fr auto; gap: .25rem .75rem; margin: 1rem 0; }
    .range-control input { grid-column: 1 / -1; width: 100%; }
    #status { margin-top: .75rem; }
    .latest { font-size: clamp(2rem, 7vw, 3.5rem); font-weight: 700; }
    #chart { width: 100%; height: 300px; display: block; overflow: visible; }
    .table-wrap { overflow-x: auto; max-height: 65vh; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: .55rem; border-bottom: 1px solid color-mix(in srgb, CanvasText 16%, transparent); text-align: left; }
    th { position: sticky; top: 0; background: Canvas; }
    td.value { text-align: right; font-variant-numeric: tabular-nums; }
    .source { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <header>
    <h1 id="page-title">Wasser-Messdaten Berlin</h1>
    <div id="series-description" class="muted"></div>
  </header>

  <section class="panel">
    <h2>HTML-Datensicherung</h2>
    <p>Die Messreihe wird automatisch geladen und unabhängig vom ThingsBoard-Upload gespeichert.</p>
    <div class="controls">
      <label id="series-picker-wrap" hidden>Messreihe
        <select id="series-picker"></select>
      </label>
      <button id="reload" type="button">Messwerte aktualisieren</button>
    </div>
    <p id="status" role="status" aria-live="polite">Messwerte werden geladen …</p>
  </section>

  <section id="results" hidden>
    <section class="panel">
      <div id="latest-label" class="muted">Neuester Messwert im ausgewählten Zeitraum</div>
      <div class="latest"><span id="latest-value">–</span> <small id="unit"></small></div>
      <div id="latest-date" class="muted"></div>
    </section>
    <section class="panel">
      <h2 id="chart-title">Messreihe</h2>
      <p id="measurement-summary" class="muted"></p>
      <div class="range-control">
        <label for="range-start">Zeitraum von</label>
        <output id="range-start-date" for="range-start"></output>
        <input id="range-start" type="range" min="0" max="0" value="0" disabled>
      </div>
      <div class="range-control">
        <label for="range-end">Zeitraum bis</label>
        <output id="range-end-date" for="range-end"></output>
        <input id="range-end" type="range" min="0" max="0" value="0" disabled>
      </div>
      <svg id="chart" role="img" aria-label="Zeitreihe der Messwerte"></svg>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Messdatum</th><th id="value-heading" style="text-align:right"></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </section>

  <p class="source muted">Quelle: <a href="https://wasserportal.berlin.de/start.php" target="_blank" rel="noopener">Wasserportal Berlin</a></p>

  <script>
    const status = document.querySelector('#status');
    const reloadButton = document.querySelector('#reload');
    const seriesPicker = document.querySelector('#series-picker');
    const startSlider = document.querySelector('#range-start');
    const endSlider = document.querySelector('#range-end');
    let seriesList = [];
    let activeSeries = null;
    let measurements = [];

    function formatDate(date, options = {}) {
      return date.toLocaleString('de-DE', {timeZone: 'UTC', ...options});
    }

    function formatValue(value, minimumFractionDigits = 2, maximumFractionDigits = 3) {
      return value.toLocaleString('de-DE', {minimumFractionDigits, maximumFractionDigits});
    }

    function renderSelectedRange() {
      if (!measurements.length) return;
      let start = Number(startSlider.value);
      let end = Number(endSlider.value);
      if (start > end) {
        if (document.activeElement === startSlider) {
          end = start;
          endSlider.value = end;
        } else {
          start = end;
          startSlider.value = start;
        }
      }

      const visible = measurements.slice(start, end + 1);
      document.querySelector('#range-start-date').textContent = formatDate(measurements[start].date, {dateStyle: 'medium'});
      document.querySelector('#range-end-date').textContent = formatDate(measurements[end].date, {dateStyle: 'medium'});
      document.querySelector('#latest-value').textContent = formatValue(visible.at(-1).value, activeSeries.minimum_fraction_digits ?? 2, activeSeries.maximum_fraction_digits ?? 3);
      document.querySelector('#latest-date').textContent = formatDate(visible.at(-1).date);
      document.querySelector('#measurement-summary').textContent =
        `${visible.length.toLocaleString('de-DE')} von ${measurements.length.toLocaleString('de-DE')} Messwerten · ${formatDate(visible[0].date, {dateStyle: 'medium'})} bis ${formatDate(visible.at(-1).date, {dateStyle: 'medium'})}`;
      document.querySelector('#rows').replaceChildren(...visible.slice().reverse().map(item => {
        const row = document.createElement('tr');
        const dateCell = document.createElement('td');
        const valueCell = document.createElement('td');
        dateCell.textContent = formatDate(item.date);
        valueCell.className = 'value';
        valueCell.textContent = formatValue(item.value, activeSeries.minimum_fraction_digits ?? 2, activeSeries.maximum_fraction_digits ?? 3);
        row.append(dateCell, valueCell);
        return row;
      }));
      drawChart(visible);
    }

    function selectSeries(seriesId) {
      activeSeries = seriesList.find(item => item.id === seriesId) || seriesList[0];
      if (!activeSeries) return;
      measurements = activeSeries.measurements
        .map(item => ({date: new Date(item.ts), value: Number(item.value)}))
        .filter(item => Number.isFinite(item.date.getTime()) && Number.isFinite(item.value))
        .sort((a, b) => a.date - b.date);
      if (!measurements.length) {
        document.querySelector('#results').hidden = true;
        status.textContent = 'Die ausgewählte Messreihe enthält noch keine gültigen Messwerte.';
        return;
      }

      document.querySelector('#results').hidden = false;
      document.querySelector('#page-title').textContent = `${activeSeries.parameter_name} – Messstelle ${activeSeries.station_id}`;
      document.querySelector('#series-description').textContent = `${activeSeries.station_name} · ${activeSeries.parameter_name} · ${activeSeries.unit}`;
      document.querySelector('#chart-title').textContent = activeSeries.parameter_name;
      document.querySelector('#unit').textContent = activeSeries.unit;
      document.querySelector('#value-heading').textContent = `${activeSeries.parameter_name} (${activeSeries.unit})`;
      document.querySelector('#chart').setAttribute('aria-label', `${activeSeries.parameter_name} – ${activeSeries.station_name}`);

      for (const slider of [startSlider, endSlider]) {
        slider.min = '0';
        slider.max = String(measurements.length - 1);
        slider.disabled = measurements.length < 2;
      }
      startSlider.value = '0';
      endSlider.value = String(measurements.length - 1);
      renderSelectedRange();
    }

    async function loadMeasurements() {
      reloadButton.disabled = true;
      status.textContent = 'Messwerte werden geladen …';
      try {
        const dataFile = window.location.protocol === 'file:'
          ? 'https://raw.githubusercontent.com/JanusWebHub/ReSource_KZW/main/groundwater-data.json'
          : 'groundwater-data.json';
        const response = await fetch(`${dataFile}?updated=${Date.now()}`, {cache: 'no-store'});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (!Array.isArray(data.series) || !data.updated_at) {
          throw new Error('Die Datendatei hat ein ungültiges Format.');
        }
        seriesList = data.series;
        const oldSelection = seriesPicker.value;
        seriesPicker.replaceChildren(...seriesList.map(series => {
          const option = document.createElement('option');
          option.value = series.id;
          option.textContent = `${series.station_name} – ${series.parameter_name}`;
          return option;
        }));
        document.querySelector('#series-picker-wrap').hidden = seriesList.length < 2;
        if (seriesList.some(series => series.id === oldSelection)) {
          seriesPicker.value = oldSelection;
        }
        selectSeries(seriesPicker.value || seriesList[0]?.id);
        if (activeSeries && measurements.length) {
          status.textContent = `HTML-Datensicherung: ${measurements.length.toLocaleString('de-DE')} Messwerte geladen. Datenstand: ${formatDate(new Date(data.updated_at))}.`;
        }
      } catch (error) {
        status.textContent = `Messwerte konnten nicht geladen werden (${error.message}). Bitte die Seite über GitHub Pages oder einen lokalen Webserver öffnen; der direkte Datei-Aufruf (file://) kann Datendateien nicht laden.`;
      } finally {
        reloadButton.disabled = false;
      }
    }

    function drawChart(data) {
      const svg = document.querySelector('#chart'), width = Math.max(320, svg.clientWidth || 800), height = 300;
      const pad = {l: 64, r: 18, t: 18, b: 42};
      let min = data[0].value, max = data[0].value;
      for (const item of data) {
        min = Math.min(min, item.value);
        max = Math.max(max, item.value);
      }
      if (min === max) { min -= 1; max += 1; }
      const firstTime = data[0].date.getTime(), lastTime = data.at(-1).date.getTime();
      const x = date => pad.l + (date.getTime() - firstTime) * (width - pad.l - pad.r) / Math.max(1, lastTime - firstTime);
      const y = value => pad.t + (max - value) * (height - pad.t - pad.b) / (max - min);
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      svg.replaceChildren();
      const ns = 'http://www.w3.org/2000/svg';
      const add = (tag, attrs, text) => {
        const element = document.createElementNS(ns, tag);
        for (const [key, value] of Object.entries(attrs)) element.setAttribute(key, value);
        if (text) element.textContent = text;
        svg.append(element);
        return element;
      };
      for (let i = 0; i < 4; i++) {
        const value = max - i * (max - min) / 3, yy = y(value);
        add('line', {x1: pad.l, y1: yy, x2: width - pad.r, y2: yy, stroke: 'currentColor', 'stroke-opacity': '.18'});
        add('text', {x: pad.l - 8, y: yy + 4, 'text-anchor': 'end', fill: 'currentColor', 'font-size': '12'}, formatValue(value, 0, activeSeries.maximum_fraction_digits ?? 2));
      }
      add('polyline', {
        points: data.map(item => `${x(item.date)},${y(item.value)}`).join(' '),
        fill: 'none', stroke: '#d94b55', 'stroke-width': '3', 'stroke-linejoin': 'round', 'stroke-linecap': 'round'
      });
      data.forEach((item, index) => {
        if (data.length <= 100) add('circle', {cx: x(item.date), cy: y(item.value), r: '2', fill: '#d94b55'});
        if (index === 0 || index === data.length - 1) {
          add('text', {x: x(item.date), y: height - 12, 'text-anchor': index === 0 ? 'start' : 'end', fill: 'currentColor', 'font-size': '11'}, formatDate(item.date, {dateStyle: 'short'}));
        }
      });
    }

    seriesPicker.addEventListener('change', () => selectSeries(seriesPicker.value));
    startSlider.addEventListener('input', renderSelectedRange);
    endSlider.addEventListener('input', renderSelectedRange);
    reloadButton.addEventListener('click', loadMeasurements);
    window.addEventListener('resize', () => { if (measurements.length) renderSelectedRange(); });
    loadMeasurements();
    window.setInterval(loadMeasurements, 24 * 60 * 60 * 1000);
  </script>
</body>
</html>
