name: Update groundwater


on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  send-groundwater:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch groundwater value
        id: fetch
        env:
          SITE_URL: https://wasserportal.berlin.de/station.php?anzeige=d&station=1&thema=gws&nstoffid=0&nstoffid2=0
        run: |
          python - <<'PY'
          import os
          import sys
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          import time

          url = os.environ["SITE_URL"]

          today = datetime.now(timezone.utc).strftime("%d.%m.%Y")
          form = urllib.parse.urlencode({
              "sreihe": "ew",
              "smode": "c",
              "sdatum": "01.11.1953",
              "senddatum": today,
              "exportthema": "gw",
          }).encode("ascii")

          request = urllib.request.Request(
              url,
              data=form,
              headers={
                  "Content-Type": "application/x-www-form-urlencoded",
                  "Accept": "text/csv,text/plain,*/*",
                  "Referer": "https://wasserportal.berlin.de/station.php?anzeige=d&station=1&thema=gws",
                  "User-Agent": "ReSource-KZW groundwater collector",
              },
              method="POST",
          )

          csv_text = None
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      csv_text = response.read().decode("utf-8", errors="replace")
                  break  # Exit the loop if the request was successful
              except Exception as e:
                  print(f"Attempt {attempt + 1}: Failed to download groundwater CSV: {e}", file=sys.stderr)
                  time.sleep(5)  # Wait before retrying
          else:
              print("All attempts to download groundwater CSV failed.", file=sys.stderr)
              sys.exit(1)

          print(f"CSV response length: {len(csv_text)} characters")
          print("CSV response start:")
          print("\n".join(csv_text.splitlines()[:18]))

          latest_date = None
          latest_value = None

          for line in csv_text.splitlines():
              columns = line.split(";")
              if len(columns) < 2:
                  continue

              date_text = columns[0].strip().strip('"')
              value_text = columns[1].strip().strip('"')

              try:
                  measurement_date = datetime.strptime(date_text, "%d.%m.%Y")
                  measurement_value = float(value_text.replace(".", "").replace(",", "."))
              except ValueError:
                  continue

              # Only plausible groundwater elevations in m ü. NHN are accepted.
              if -100 <= measurement_value <= 1000:
                  if latest_date is None or measurement_date > latest_date:
                      latest_date = measurement_date
                      latest_value = measurement_value

          if latest_date is None:
              print("No valid groundwater measurement found in the CSV export.", file=sys.stderr)
              sys.exit(1)

          print(f"measurement_date={latest_date.strftime('%Y-%m-%d')}")
          print(f"value={latest_value:.2f}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"measurement_date={latest_date.strftime('%Y-%m-%d')}\n")
              output.write(f"value={latest_value:.2f}\n")
          PY

      - name: Send telemetry to ThingsBoard
        env:
          URL: ${{ vars.THINGSBOARD_URL }}
          TOKEN: ${{ secrets.MESSSTELLE_1 }}
          VALUE: ${{ steps.fetch.outputs.value }}
          MEASURED_AT: ${{ steps.fetch.outputs.measurement_date }}
        run: |
          if [ -z "${URL}" ] || [ -z "${TOKEN}" ]; then
            echo "Missing THINGSBOARD_URL or MESSSTELLE_1"
            exit 1
          fi

          curl -fsS -X POST \
            -H "Content-Type: application/json" \
            --data "{\"station_id\":1,\"station\":\"Reinickendorf\",\"groundwater_level\":${VALUE},\"unit\":\"m u. NHN\",\"measured_at\":\"${MEASURED_AT}\"}" \
            "${URL}/api/v1/${TOKEN}/telemetry" \
            -w "\nThingsBoard HTTP status: %{http_code}\n"

          echo "Sent groundwater_level=${VALUE} m u. NHN from ${MEASURED_AT}"
