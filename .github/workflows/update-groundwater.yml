name: Update groundwater

on:
  push:
    branches:
      - main
    paths-ignore:
      - groundwater-sync-state.json
      - groundwater-data.json
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: groundwater-sync
  cancel-in-progress: false

jobs:
  send-groundwater:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test groundwater synchronization
        run: python -m unittest discover -s tests

      - name: Check ThingsBoard REST API access
        env:
          THINGSBOARD_URL: ${{ vars.THINGSBOARD_URL }}
          THINGSBOARD_API_KEY: ${{ secrets.THINGSBOARD_API_KEY }}
        run: python scripts/sync_groundwater.py check-api groundwater-sync-state.json groundwater-data.json measurement-series.json

      - name: Fetch Waterportal data and update HTML backup
        run: python scripts/sync_groundwater.py fetch groundwater-sync-state.json groundwater-data.json measurement-series.json

      - name: Publish HTML backup and fetch progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add groundwater-sync-state.json groundwater-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update groundwater HTML backup"
            for attempt in 1 2 3; do
              git fetch origin "${GITHUB_REF_NAME}"
              if git merge --no-edit -X ours "origin/${GITHUB_REF_NAME}"; then
                if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                  exit 0
                fi
              fi
              sleep 5
            done
            echo "Could not publish HTML backup after 3 attempts" >&2
            exit 1
          fi

      - name: Upload new measurements to ThingsBoard
        continue-on-error: true
        env:
          THINGSBOARD_URL: ${{ vars.THINGSBOARD_URL }}
          THINGSBOARD_TOKEN: ${{ secrets.MESSSTELLE_1 }}
        run: python scripts/sync_groundwater.py upload groundwater-sync-state.json groundwater-data.json measurement-series.json

      - name: Save ThingsBoard upload progress
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add groundwater-sync-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update ThingsBoard upload cursor"
            for attempt in 1 2 3; do
              git fetch origin "${GITHUB_REF_NAME}"
              if git merge --no-edit -X ours "origin/${GITHUB_REF_NAME}"; then
                if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                  exit 0
                fi
              fi
              sleep 5
            done
            echo "Could not publish ThingsBoard upload cursor after 3 attempts" >&2
            exit 1
          fi
