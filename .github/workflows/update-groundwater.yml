name: Update groundwater


on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  send-groundwater:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch groundwater value
        id: fetch
        env:
          SITE_URL: https://wasserportal.berlin.de/station.php?anzeige=d&station=1&thema=gws&nstoffid=0&nstoffid2=0
        run: |
          TODAY="$(date -u +%d.%m.%Y)"

          curl --fail --show-error --location --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 30 --max-time 120 \
            -A "ReSource-KZW groundwater collector" \
            -H "Accept: text/csv,text/plain,*/*" \
            -e "https://wasserportal.berlin.de/station.php?anzeige=d&station=1&thema=gws" \
            --data-urlencode "sreihe=ew" \
            --data-urlencode "smode=c" \
            --data-urlencode "sdatum=01.11.1953" \
            --data-urlencode "senddatum=${TODAY}" \
            --data-urlencode "exportthema=gw" \
            --output groundwater.csv \
            "$SITE_URL"

          python - <<'PY'
          import os
          import sys
          import json
          from datetime import datetime, timezone

          try:
              with open("groundwater.csv", "r", encoding="utf-8", errors="replace") as source:
                  csv_text = source.read()
          except Exception as e:
              print(f"Failed to read downloaded groundwater CSV: {e}", file=sys.stderr)
              sys.exit(1)

          print(f"CSV response length: {len(csv_text)} characters")
          print("CSV response start:")
          print("\n".join(csv_text.splitlines()[:18]))

          measurements = {}

          for line in csv_text.splitlines():
              columns = line.split(";")
              if len(columns) < 2:
                  continue

              date_text = columns[0].strip().strip('"')
              value_text = columns[1].strip().strip('"')

              try:
                  measurement_date = datetime.strptime(date_text, "%d.%m.%Y")
                  measurement_value = float(value_text.replace(".", "").replace(",", "."))
              except ValueError:
                  continue

              # Only plausible groundwater elevations in m ü. NHN are accepted.
              if -100 <= measurement_value <= 1000:
                  measurements[measurement_date] = measurement_value

          ordered_measurements = sorted(measurements.items())
          if not ordered_measurements:
              print("No valid groundwater measurement found in the CSV export.", file=sys.stderr)
              sys.exit(1)

          latest_date, latest_value = ordered_measurements[-1]
          print(f"measurement_date={latest_date.strftime('%Y-%m-%d')}")
          print(f"value={latest_value:.2f}")
          print(f"measurement_count={len(ordered_measurements)}")

          batch_size = 500
          with open("groundwater-batches.jsonl", "w", encoding="utf-8") as batches:
              for start in range(0, len(ordered_measurements), batch_size):
                  batch = []
                  for measurement_date, measurement_value in ordered_measurements[start:start + batch_size]:
                      timestamp = int(measurement_date.replace(tzinfo=timezone.utc).timestamp() * 1000)
                      batch.append({
                          "ts": timestamp,
                          "values": {
                              "groundwater_level": measurement_value
                          }
                      })
                  batches.write(json.dumps(batch, ensure_ascii=False, separators=(",", ":")) + "\n")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"measurement_date={latest_date.strftime('%Y-%m-%d')}\n")
              output.write(f"value={latest_value:.2f}\n")
              output.write(f"measurement_count={len(ordered_measurements)}\n")
          PY

      - name: Send telemetry to ThingsBoard
        env:
          URL: ${{ vars.THINGSBOARD_URL }}
          TOKEN: ${{ secrets.MESSSTELLE_1 }}
        run: |
          if [ -z "${URL}" ] || [ -z "${TOKEN}" ]; then
            echo "Missing THINGSBOARD_URL or MESSSTELLE_1"
            exit 1
          fi

          python - <<'PY'
          import os
          import sys
          import urllib.error
          import urllib.request

          base_url = os.environ["URL"].rstrip("/")
          token = os.environ["TOKEN"]
          endpoint = f"{base_url}/api/v1/{token}/telemetry"

          sent_measurements = 0
          try:
              with open("groundwater-batches.jsonl", "r", encoding="utf-8") as batches:
                  for batch_number, line in enumerate(batches, start=1):
                      payload = line.strip().encode("utf-8")
                      if not payload:
                          continue

                      request = urllib.request.Request(
                          endpoint,
                          data=payload,
                          headers={"Content-Type": "application/json"},
                          method="POST",
                      )
                      try:
                          with urllib.request.urlopen(request, timeout=120) as response:
                              if response.status >= 300:
                                  raise RuntimeError(f"ThingsBoard HTTP status: {response.status}")
                      except urllib.error.HTTPError as e:
                          print(f"ThingsBoard rejected batch {batch_number}: HTTP {e.code}", file=sys.stderr)
                          raise

                      sent_measurements += payload.count(b'{"ts":')
                      print(f"Sent batch {batch_number}")
          except (OSError, urllib.error.URLError, RuntimeError) as e:
              print(f"Failed to send groundwater telemetry: {e}", file=sys.stderr)
              sys.exit(1)

          print(f"Sent {sent_measurements} groundwater measurements")
          PY
